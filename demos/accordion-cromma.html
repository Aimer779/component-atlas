<main id="sample" class="sample vertical"><div id="faq" class="faq-sample"><div class="rounded-2xl border border-border bg-panel shadow-sm overflow-hidden bg-card"><button type="button" class="cursor-pointer select-none outline-none disabled:cursor-not-allowed aria-disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-primary/40 flex w-full items-start gap-4 px-5 py-4 text-left" aria-expanded="true"><div class="min-w-0 flex-1"><div class="text-base font-medium text-foreground">What is Cromma?</div><div class="grid transition-[grid-template-rows,opacity,margin] duration-300 ease-drawer mt-2 grid-rows-[1fr] opacity-100"><p class="overflow-hidden text-base leading-relaxed text-muted-foreground">A generator, loader and publisher of apps. It starts as a browser. You describe your work and your life; Cromma’s maker agent builds an app that is yours, keeps it in your sidebar, lets you change it in a sentence, and publishes it to colleagues or to the world when you choose.</p></div></div><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="mt-1 shrink-0 text-muted-foreground transition-transform duration-300 ease-drawer rotate-45"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button></div><div class="rounded-2xl border border-border bg-panel shadow-sm overflow-hidden bg-card"><button type="button" class="cursor-pointer select-none outline-none disabled:cursor-not-allowed aria-disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-primary/40 flex w-full items-start gap-4 px-5 py-4 text-left" aria-expanded="false"><div class="min-w-0 flex-1"><div class="text-base font-medium text-foreground">I cannot code at all. Can I use it?</div><div class="grid transition-[grid-template-rows,opacity,margin] duration-300 ease-drawer grid-rows-[0fr] opacity-0"><p class="overflow-hidden text-base leading-relaxed text-muted-foreground">That is exactly who Cromma is for. You never see code, never pick components, never choose colors. Cromma’s design system guards the taste, so your app looks like a professional team made it.</p></div></div><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="mt-1 shrink-0 text-muted-foreground transition-transform duration-300 ease-drawer "><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button></div><div class="rounded-2xl border border-border bg-panel shadow-sm overflow-hidden bg-card"><button type="button" class="cursor-pointer select-none outline-none disabled:cursor-not-allowed aria-disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-primary/40 flex w-full items-start gap-4 px-5 py-4 text-left" aria-expanded="false"><div class="min-w-0 flex-1"><div class="text-base font-medium text-foreground">Where is my data?</div><div class="grid transition-[grid-template-rows,opacity,margin] duration-300 ease-drawer grid-rows-[0fr] opacity-0"><p class="overflow-hidden text-base leading-relaxed text-muted-foreground">On the Local plan, the app, its database and its files all stay on your computer. Data leaves only when you choose to publish to Cromma Cloud.</p></div></div><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="mt-1 shrink-0 text-muted-foreground transition-transform duration-300 ease-drawer "><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button></div></div></main>
