<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>toast-cromma · Component Atlas</title><link rel="stylesheet" href="../snapshots/cromma.css">
<link rel="stylesheet" href="demo.css"></head>
<body data-demo="toast" data-theme="cromma" data-variant="toast-cromma">
<main id="sample" class="sample relative"><button type="button" data-toast-open class="cromma-tag relative overflow-hidden rounded-2xl h-8 px-4">显示材质提示</button><div class="laper-toast-viewport absolute bottom-6 left-1/2 w-125 max-w-[calc(100vw-2rem)]" role="status" aria-live="polite"></div><template id="toast-template"><div class="laper-toast flex min-w-75 max-w-125 items-center gap-3 overflow-hidden rounded-2xl bg-card px-4 py-3">
      <span aria-hidden="true" class="laper-toast-content pointer-events-none absolute inset-x-0 bottom-0 h-3/5 opacity-50" style="mask-image: linear-gradient(to top, black 0%, rgb(0 0 0 / 0.5) 45%, transparent 100%)">
        <div class="h-full w-full" data-toast-field></div>
      </span>
      <div class="laper-toast-content relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full">
        <div aria-hidden="true" class="absolute inset-0 rounded-full" style="background: linear-gradient(180deg, color-mix(in srgb, var(--info) 24%, transparent), color-mix(in srgb, var(--info) 44%, transparent)); padding: 2px; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude"></div>
        <div class="relative z-10 flex h-full w-full items-center justify-center rounded-full" style="background: linear-gradient(180deg, color-mix(in srgb, var(--info) 4%, transparent), color-mix(in srgb, var(--info) 28%, transparent)); color: var(--info)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg>
        </div>
      </div>
      <div class="laper-toast-content flex min-w-0 flex-1 flex-col gap-0.5">
        <div class="text-sm leading-[1.4em] font-semibold text-foreground">Note</div>
        <div class="text-sm leading-[1.4em] font-normal text-foreground/[0.68]">This is a local component preview.</div>
      </div>
      <div class="laper-toast-content relative shrink-0">
        <svg class="-rotate-90" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="var(--info)" stroke-width="3" stroke-dasharray="106.814" stroke-linecap="round" class="opacity-50" style="animation: toast-progress 5000ms linear forwards"></circle></svg>
        <button type="button" data-close aria-label="Dismiss" class="toast-close-btn absolute inset-0 flex cursor-pointer items-center justify-center rounded-full bg-background/60">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div></div></template></main>
<script src="../engines/field.js"></script>
<script src="../demos/demo.js"></script>
<script type="module" src="../demos/motion.js"></script></body></html>
